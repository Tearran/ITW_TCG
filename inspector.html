<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Into the Wild — Card Data Inspector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #151515;
      color: #eee;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }

    header {

      top: 0;
      z-index: 10;
      padding: 14px 18px;
      background: #202020;
      border-bottom: 1px solid #444;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button,
    select,
    input {
      background: #292929;
      color: #eee;
      border: 1px solid #555;
      border-radius: 5px;
      padding: 7px 10px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #383838;
    }

    .summary {
      color: #bbb;
      font-size: 13px;
      margin-top: 8px;
    }

    #status {
      margin: 8px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    main {
      padding: 18px;
    }

    .group {
      margin-bottom: 28px;
    }

    .group h2 {
      margin: 0 0 10px;
      font-size: 18px;
      text-transform: capitalize;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 14px;
    }

    /*
      Card status:
      green  = clean
      yellow = caution / review
      red    = correction required
    */
    .card {
      background: #222;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
    }

    .card.clean {
      border-color: #4f9d69;
    }

    .card.warning {
      border-color: #c58a22;
    }

    .card.error {
      border-color: #b83b3b;
    }

    /* Card name comes before the illustration. */
    .title {
      padding: 12px 12px 8px;
      font-size: 18px;
      font-weight: 700;
    }

    /*
      Artwork is the actual illustration area:
      644px wide x 375px high aspect ratio.
    */
    .art {
      width: 100%;
      aspect-ratio: 644 / 375;
      background: #e8dcc2;
      display: block;
      overflow: hidden;
    }

    .art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .art .missing {
      color: #a33;
      background: #eee;
      padding: 20px;
      text-align: center;
    }

    .body {
      padding: 12px;
    }

    .scientific {
      color: #aaa;
      font-style: italic;
      font-size: 13px;
      margin-bottom: 10px;
    }

    /* Suit, cost, rank, ID */
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #444;
    }

    .badge {
      border: 1px solid #555;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
    }

    .badge.warn {
      border-color: #c58a22;
      color: #e6b84b;
    }

    .badge.error {
      border-color: #b83b3b;
      color: #ff7373;
    }

    .badge.ok-badge {
      border-color: #4f9d69;
      color: #78c98f;
    }

    .section-label {
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 10px 0 4px;
    }

    .fact {
      color: #ccc;
      font-size: 12px;
      line-height: 1.4;
    }

    .effects {
      color: #ddd;
      font-size: 12px;
      line-height: 1.4;
    }

    .effects ul {
      margin: 3px 0 0 18px;
      padding: 0;
    }

    .effects li {
      margin: 2px 0;
    }

    /* Artist and expansion */
    .credits {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #444;
      font-size: 12px;
    }

    .credits-label {
      color: #999;
    }

    .issues {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 12px;
    }

    .file {
      margin-top: 10px;
      color: #8fb4d9;
      font: 11px monospace;
      word-break: break-all;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <h1>Into the Wild — Card Data Inspector</h1>

    <div class="toolbar">
      <button id="loadBtn">Load JSON</button>

      <input id="search" type="search" placeholder="Search name, ID, artwork...">

      <select id="typeFilter">
        <option value="all">All card types</option>
      </select>

      <select id="issueFilter">
        <option value="all">All records</option>
        <option value="issues">Show flagged records</option>
        <option value="clean">Show unflagged records</option>
      </select>

      <button id="sortBtn">Sort: JSON order</button>
    </div>

    <div class="summary" id="summary">
      No JSON loaded.
    </div>

    <div id="status"></div>
  </header>

  <main id="cards"></main>

  <script>
    const state = {
      data: [],
      sort: "json"
    };

    const $ = id => document.getElementById(id);

    /*
     * ------------------------------------------------------------
     * File loading
     * ------------------------------------------------------------
     */

    $("loadBtn").addEventListener("click", () => $("fileInput").click());

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".json,application/json";
    fileInput.id = "fileInput";
    fileInput.className = "hidden";
    document.body.appendChild(fileInput);

    fileInput.addEventListener("change", async event => {
      const file = event.target.files[0];

      if (!file) {
        return;
      }

      try {
        const text = await file.text();
        const json = JSON.parse(text);
        loadData(json);
      } catch (error) {
        $("status").textContent =
          "Could not load JSON: " + error.message;
      }
    });

    /*
     * ------------------------------------------------------------
     * Controls
     * ------------------------------------------------------------
     */

    $("search").addEventListener("input", render);
    $("typeFilter").addEventListener("change", render);
    $("issueFilter").addEventListener("change", render);

    $("sortBtn").addEventListener("click", () => {
      const modes = [
        "json",
        "type",
        "rank",
        "id",
        "name"
      ];

      const next =
        modes[(modes.indexOf(state.sort) + 1) % modes.length];

      state.sort = next;

      $("sortBtn").textContent =
        "Sort: " + ({
          json: "JSON order",
          type: "Card type",
          rank: "Rank",
          id: "ID",
          name: "Name"
        }[next]);

      render();
    });

    /*
     * ------------------------------------------------------------
     * Data loading
     * ------------------------------------------------------------
     */

    function loadData(json) {
      if (!Array.isArray(json)) {
        throw new Error(
          "Expected the top-level JSON value to be an array."
        );
      }

      state.data = json.map((card, index) => ({
        ...card,
        __index: index
      }));

      populateTypeFilter();
      analyze();
      render();
    }

    function populateTypeFilter() {
      const types = [
        ...new Set(
          state.data
            .map(card => card?.mechanics?.suit)
            .filter(Boolean)
        )
      ];

      $("typeFilter").innerHTML =
        '<option value="all">All card types</option>' +
        types
          .map(type =>
            `<option value="${esc(type)}">${esc(type)}</option>`
          )
          .join("");
    }

    /*
     * ------------------------------------------------------------
     * Data inspection
     * ------------------------------------------------------------
     */

    function analyze() {
      const ids = new Map();
      const arts = new Map();

      state.data.forEach(card => {
        const id = card?.mechanics?.id;
        const art = card?.metadata?.illustration;

        if (id !== undefined) {
          ids.set(
            id,
            [...(ids.get(id) || []), card]
          );
        }

        if (art) {
          arts.set(
            art,
            [...(arts.get(art) || []), card]
          );
        }
      });

      state.data.forEach(card => {
        card.__issues = [];

        const id = card?.mechanics?.id;
        const art = card?.metadata?.illustration || "";
        const name =
          (card?.metadata?.name || "")
            .toLowerCase();

        const artFile =
          art
            .split("/")
            .pop()
            .replace(/\.svg$/i, "")
            .toLowerCase();

        /*
         * RED:
         * Duplicate ID should actually be corrected.
         */
        if (
          id !== undefined &&
          ids.get(id).length > 1
        ) {
          card.__issues.push("Duplicate ID");
        }

        /*
         * YELLOW:
         * Reusing artwork is something to review,
         * but is not automatically an error.
         */
        if (
          art &&
          arts.get(art).length > 1
        ) {
          card.__issues.push("Duplicate artwork");
        }

        /*
         * YELLOW:
         * The normal convention is for the artwork filename
         * to correspond to the card name.
         *
         * This is deliberately a caution/review item rather
         * than an automatic error because representational
         * artwork can legitimately have another descriptive name.
         *
         * Normalize spaces, hyphens, underscores and punctuation
         * so:
         *
         * Desert-nesting Bald Eagle
         * desert-nesting_bald_eagle.svg
         *
         * are considered a match.
         */
        const normalizedName =
          name.replace(/[^a-z0-9]/g, "");

        const normalizedArt =
          artFile.replace(/[^a-z0-9]/g, "");

        if (
          normalizedName &&
          normalizedArt &&
          normalizedName !== normalizedArt
        ) {
          card.__issues.push(
            "Possible artwork/name mismatch"
          );
        }

        /*
         * RED:
         * Missing artwork path.
         */
        if (!art) {
          card.__issues.push(
            "Missing artwork"
          );
        }
      });

      const issueCount =
        state.data.filter(
          card => card.__issues.length
        ).length;

      const duplicateIds = [
        ...new Set(
          state.data
            .filter(card =>
              card.__issues.includes("Duplicate ID")
            )
            .map(card =>
              card?.mechanics?.id
            )
        )
      ];

      $("summary").textContent =
        `${state.data.length} records • ` +
        `${issueCount} flagged • ` +
        `${duplicateIds.length} duplicate ID ` +
        `value${duplicateIds.length === 1 ? "" : "s"}`;
    }

    /*
     * ------------------------------------------------------------
     * Filtering and sorting
     * ------------------------------------------------------------
     */

    function filteredData() {
      const search =
        $("search").value
          .trim()
          .toLowerCase();

      const type =
        $("typeFilter").value;

      const issue =
        $("issueFilter").value;

      let result =
        state.data.filter(card => {
          const text =
            JSON.stringify(card)
              .toLowerCase();

          const matchesSearch =
            !search ||
            text.includes(search);

          const matchesType =
            type === "all" ||
            card?.mechanics?.suit === type;

          const hasIssues =
            (card.__issues || []).length > 0;

          const matchesIssue =
            issue === "all" ||
            (issue === "issues" && hasIssues) ||
            (issue === "clean" && !hasIssues);

          return (
            matchesSearch &&
            matchesType &&
            matchesIssue
          );
        });

      if (state.sort === "type") {
        result.sort((a, b) =>
          String(a?.mechanics?.suit)
            .localeCompare(
              String(b?.mechanics?.suit)
            )
        );
      }

      if (state.sort === "rank") {
        result.sort((a, b) =>
          Number(a?.mechanics?.rank ?? 999) -
          Number(b?.mechanics?.rank ?? 999)
        );
      }

      if (state.sort === "id") {
        result.sort((a, b) =>
          Number(a?.mechanics?.id ?? 999999) -
          Number(b?.mechanics?.id ?? 999999)
        );
      }

      if (state.sort === "name") {
        result.sort((a, b) =>
          String(a?.metadata?.name)
            .localeCompare(
              String(b?.metadata?.name)
            )
        );
      }

      return result;
    }

    /*
     * ------------------------------------------------------------
     * Rendering
     * ------------------------------------------------------------
     */

    function render() {
      const list = filteredData();
      const root = $("cards");

      if (!list.length) {
        root.innerHTML =
          '<div class="empty">' +
          'No cards match the current filters.' +
          '</div>';

        return;
      }

      const groups = {};

      list.forEach(card => {
        const type =
          card?.mechanics?.suit ||
          "unknown";

        (groups[type] ||= []).push(card);
      });

      root.innerHTML =
        Object.entries(groups)
          .map(([type, cards]) => `
          <section class="group">
            <h2>
              ${esc(type)} (${cards.length})
            </h2>

            <div class="grid">
              ${cards.map(cardHTML).join("")}
            </div>
          </section>
        `)
          .join("");
    }

    /*
     * ------------------------------------------------------------
     * Card layout
     *
     * Name
     * Illustration
     * Scientific name
     * Suit / Cost / Rank / ID
     * Fact
     * Effects
     * Artist / Expansion
     * Inspector status
     * Artwork path
     * ------------------------------------------------------------
     */

    function cardHTML(card) {
      const mechanics =
        card?.mechanics || {};

      const metadata =
        card?.metadata || {};

      const issues =
        card.__issues || [];

      const hasRedIssue =
        issues.some(issue =>
          issue.includes("Duplicate ID") ||
          issue.includes("Missing artwork")
        );

      const hasYellowIssue =
        issues.some(issue =>
          issue.includes("Duplicate artwork") ||
          issue.includes("mismatch")
        );

      let statusClass = "clean";

      if (hasRedIssue) {
        statusClass = "error";
      } else if (hasYellowIssue) {
        statusClass = "warning";
      }

      const art =
        metadata.illustration || "";

      const effects =
        Array.isArray(mechanics.effects)
          ? mechanics.effects
          : [];

      const facts =
        Array.isArray(metadata.fact)
          ? metadata.fact
          : (
            metadata.fact
              ? [metadata.fact]
              : []
          );

      return `
      <article class="card ${statusClass}">

        <!-- NAME -->
        <div class="title">
          ${esc(
        metadata.name ||
        "Unnamed card"
      )}
        </div>

        <!-- ILLUSTRATION -->
        <div class="art">
          ${art
          ? `
                <img
                  src="${escAttr(art)}"
                  alt="${escAttr(
            metadata.name ||
            "Card artwork"
          )}"
                  onerror="
                    this.parentElement.innerHTML =
                    '<div class=&quot;missing&quot;>' +
                    'Artwork could not be loaded<br>' +
                    '<small>${escAttr(art)}</small>' +
                    '</div>'
                  "
                >
              `
          : `
                <div class="missing">
                  No artwork path
                </div>
              `
        }
        </div>

        <div class="body">

          <!-- SCIENTIFIC NAME -->
          <div class="scientific">
            ${esc(
          metadata.scientific_name ||
          "—"
        )}
          </div>

          <!-- SUIT / COST / RANK / ID -->
          <div class="stats">
            <span class="badge">
              ${esc(
          mechanics.suit ||
          "unknown"
        )}
            </span>

            <span class="badge">
              Cost ${esc(
          mechanics.cost ?? "—"
        )}
            </span>

            <span class="badge">
              Rank ${esc(
          mechanics.rank ?? "—"
        )}
            </span>

            <span class="badge">
              ID ${esc(
          mechanics.id ?? "—"
        )}
            </span>

            ${metadata.rarity
          ? `
                  <span class="badge">
                    ${esc(metadata.rarity)}
                  </span>
                `
          : ""
        }
          </div>

          <!-- FACT -->
          ${facts.length
          ? `
                <div class="section-label">
                  Fact
                </div>

                <div class="fact">
                  ${facts
            .map(esc)
            .join("<br>")}
                </div>
              `
          : ""
        }

          <!-- EFFECTS -->
          ${effects.length
          ? `
                <div class="section-label">
                  Effects
                </div>

                <div class="effects">
                  <ul>
                    ${effects
            .map(effect =>
              `<li>${esc(effect)}</li>`
            )
            .join("")}
                  </ul>
                </div>
              `
          : ""
        }

          <!-- ARTIST / EXPANSION -->
          <div class="credits">
            <div class="credits-label">
              Artist
            </div>

            <div>
              ${esc(
          metadata.artist || "—"
        )}
            </div>

            <div class="credits-label">
              Expansion
            </div>

            <div>
              ${esc(
          metadata.expansion || "—"
        )}
            </div>
          </div>

          <!-- INSPECTOR STATUS -->
          <div class="issues">
            ${issues.length
          ? issues
            .map(issue => {
              const isRed =
                issue.includes("Duplicate ID") ||
                issue.includes("Missing artwork");

              return `
                        <span class="badge ${isRed
                  ? "error"
                  : "warn"
                }">
                          ${esc(issue)}
                        </span>
                      `;
            })
            .join("")
          : `
                  <span class="badge ok-badge">
                    OK
                  </span>
                `
        }
          </div>

          <!-- ARTWORK PATH -->
          <div class="file">
            ${esc(
          art ||
          "No illustration path"
        )}
          </div>

        </div>
      </article>
    `;
    }

    /*
     * ------------------------------------------------------------
     * HTML escaping
     * ------------------------------------------------------------
     */

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escAttr(value) {
      return esc(value);
    }

    /*
     * ------------------------------------------------------------
     * Optional automatic loading
     *
     * If tonto_01.json is beside this HTML file, the browser will
     * attempt to load it automatically.
     *
     * The Load JSON button remains the reliable method when the
     * browser blocks local file access.
     * ------------------------------------------------------------
     */

    fetch("./decks/tonto_01.json")
      .then(response =>
        response.ok
          ? response.json()
          : Promise.reject()
      )
      .then(loadData)
      .catch(() => { });

  </script>

</body>

</html>
