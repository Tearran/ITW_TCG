<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Into the Wild - Prototype Room</title>
  <style>
    :root { color-scheme: dark; --bg:#122018; --panel:#1b2c22; --panel2:#22362a; --line:#395642; --text:#edf7ef; --muted:#b9c8bc; --accent:#7fd38a; --danger:#e79b8f; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .app { display:grid; gap:12px; padding:12px; max-width:1200px; margin:0 auto; }
    .bar,.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
    .bar { position:sticky; top:0; z-index:10; padding:10px; display:grid; gap:8px; }
    .status,.controls,.choice-actions,.chat-input { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .pill { padding:4px 8px; border-radius:999px; background:var(--panel2); color:var(--muted); font-size:12px; }
    .panel { padding:10px; }
    input, button, textarea { font:inherit; border-radius:10px; border:1px solid var(--line); padding:8px 10px; }
    input, textarea { background:#0f1813; color:var(--text); }
    button { background:var(--accent); color:#102014; font-weight:700; cursor:pointer; }
    button.secondary { background:var(--panel2); color:var(--text); }
    button.danger { background:var(--danger); color:#26110d; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .rows { display:grid; gap:10px; }
    .row-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .cards { display:flex; gap:8px; overflow:auto; padding-bottom:4px; }
    .card { min-width:150px; max-width:150px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:left; }
    .card.selected { outline:2px solid var(--accent); }
    .card.exhausted { opacity:.55; }
    .card-art { width:100%; max-height:90px; object-fit:cover; border-radius:6px; display:block; margin-bottom:6px; background:var(--bg); }
    .meta { font-size:12px; color:var(--muted); }
    details summary { cursor:pointer; }
    .grid { display:grid; gap:12px; grid-template-columns:1fr; }
    @media (min-width:900px){ .grid { grid-template-columns:1.2fr .8fr; } }
    #logBox { max-height:150px; overflow:auto; font-size:13px; white-space:pre-wrap; }
    #pendingPanel:empty::before { content:'No pending choices.'; color:var(--muted); font-size:12px; }
    #chatMessages { max-height:220px; overflow:auto; display:grid; gap:4px; font-size:13px; }
    #chatMessages .msg { white-space:pre-wrap; word-break:break-word; }
    #chatMessages .msg .who { color:var(--accent); font-weight:700; }
    .chat-input textarea { flex:1; resize:none; min-height:38px; }
    #message.error { color:var(--danger); }
    #message.info { color:var(--accent); }
  </style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="status" id="statusBar"></div>
    <div class="controls" id="phaseButtons"></div>
    <div id="message" class="meta"></div>
  </div>

  <div class="grid">
    <div class="rows">
      <div class="panel" id="pendingPanel"></div>
      <div class="panel">
        <div class="row-head"><strong>Opponent board</strong><span class="meta" id="opponentSummary"></span></div>
        <div id="opponentZone"></div>
      </div>
      <div class="panel">
        <div class="row-head"><strong>Your board</strong><span class="meta" id="boardSummary"></span></div>
        <div id="boardZone"></div>
      </div>
      <div class="panel">
        <div class="row-head"><strong>Your hand</strong><span class="meta" id="handSummary"></span></div>
        <div id="handZone"></div>
        <div class="choice-actions" id="playActions"></div>
      </div>
    </div>
    <div class="rows">
      <details class="panel" open><summary><strong>Log</strong></summary><div id="logBox"></div></details>
      <details class="panel" open>
        <summary><strong>Room chat</strong></summary>
        <div id="chatMessages"></div>
        <div class="chat-input">
          <textarea id="chatInput" maxlength="300" placeholder="Say something to your opponent..."></textarea>
          <button id="chatSend" type="button">Send</button>
        </div>
      </details>
      <div class="panel">
        <button id="leaveBtn" class="danger" type="button">Leave room</button>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const roomFromUrl = (params.get('room') || '').trim().toUpperCase();
  const roomCode = (sessionStorage.getItem('roomCode') || '').trim().toUpperCase();
  const playerToken = sessionStorage.getItem('playerToken') || '';

  if (!roomFromUrl || !roomCode || !playerToken || roomFromUrl !== roomCode) {
    window.location.href = 'prototype/index.php';
    return;
  }

  const state = {
    snapshot: null,
    lastVersion: null,
    selectedHand: null,
    selectedEnergy: new Set(),
    challengeAttacker: null,
    pollTimer: null,
  };

  const $ = id => document.getElementById(id);
  const statusBar = $('statusBar'), phaseButtons = $('phaseButtons'), pendingPanel = $('pendingPanel');
  const handZone = $('handZone'), boardZone = $('boardZone'), opponentZone = $('opponentZone');
  const playActions = $('playActions'), logBox = $('logBox'), message = $('message');
  const chatMessages = $('chatMessages'), chatInput = $('chatInput');

  function setMessage(text, kind) {
    message.textContent = text || '';
    message.className = kind || '';
  }

  async function api(path, options = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    headers.Authorization = 'Bearer ' + playerToken;
    const res = await fetch(path, Object.assign({}, options, { headers }));
    if (res.status === 204) {
      return null;
    }
    let data = null;
    try { data = await res.json(); } catch (err) { data = null; }
    if (!res.ok) {
      const msg = data && data.error && data.error.message ? data.error.message : ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return data;
  }

  function clearSelection() {
    state.selectedHand = null;
    state.selectedEnergy = new Set();
    state.challengeAttacker = null;
  }

  async function fetchState(force) {
    const query = new URLSearchParams({ roomCode });
    if (!force && state.lastVersion !== null) {
      query.set('sinceVersion', String(state.lastVersion));
    }
    try {
      const data = await api('prototype/api/state.php?' + query.toString(), { method: 'GET' });
      if (data) {
        state.snapshot = data;
        state.lastVersion = data.stateVersion;
        render();
      }
    } catch (err) {
      setMessage(err.message, 'error');
    }
  }

  async function sendAction(action) {
    try {
      const data = await api('prototype/api/action.php', {
        method: 'POST',
        body: JSON.stringify({ roomCode, action }),
      });
      state.snapshot = data;
      state.lastVersion = data.stateVersion;
      clearSelection();
      setMessage('');
      render();
    } catch (err) {
      setMessage(err.message, 'error');
    }
  }

  async function sendChat(text) {
    try {
      const data = await api('prototype/api/chat.php', {
        method: 'POST',
        body: JSON.stringify({ roomCode, message: text }),
      });
      state.snapshot = data;
      state.lastVersion = data.stateVersion;
      render();
    } catch (err) {
      setMessage(err.message, 'error');
    }
  }

  function cardButton(entry, opts) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'card'
      + (opts.selected ? ' selected' : '')
      + (entry.exhausted ? ' exhausted' : '');
    button.onclick = opts.onClick || null;
    if (!opts.onClick) {
      button.disabled = true;
    }

    if (entry.illustration) {
      const img = document.createElement('img');
      img.src = entry.illustration;
      img.alt = entry.name;
      img.className = 'card-art';
      button.appendChild(img);
    }
    const name = document.createElement('strong');
    name.textContent = entry.name;
    const meta1 = document.createElement('div');
    meta1.className = 'meta';
    meta1.textContent = `${entry.suit} \u2022 Rank ${entry.rank} \u2022 Cost ${entry.cost}`;
    const meta2 = document.createElement('div');
    meta2.className = 'meta';
    meta2.textContent = entry.exhausted ? 'Exhausted' : 'Ready';
    button.append(name, meta1, meta2);
    return button;
  }

  function renderZone(el, items, buildOpts) {
    el.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'cards';
    items.forEach(entry => box.appendChild(cardButton(entry, buildOpts(entry))));
    el.appendChild(box);
  }

  function phaseActionButton(label, action, disabled, cls) {
    const b = document.createElement('button');
    b.textContent = label;
    b.disabled = !!disabled;
    if (cls) b.className = cls;
    b.onclick = () => sendAction(action);
    return b;
  }

  function onHandCardClick(entry, snap, me) {
    const canSelect = snap.game.phase === 'main'
      && snap.game.currentPlayer === snap.you
      && !snap.game.pendingChallenge;
    if (!canSelect) return null;
    return () => {
      state.selectedHand = state.selectedHand === entry.instanceId ? null : entry.instanceId;
      state.selectedEnergy = new Set();
      render();
    };
  }

  function onMyBoardCardClick(entry, snap) {
    const phase = snap.game.phase;
    if (snap.game.pendingChallenge) return null;
    if (snap.game.currentPlayer !== snap.you) return null;

    // Selecting Energy cards to pay for a Support/Wildlife card.
    if (phase === 'main' && state.selectedHand && entry.suit === 'energy' && !entry.exhausted) {
      const hand = snap.game.players[0].hand.find(h => h.instanceId === state.selectedHand);
      if (hand && hand.suit !== 'energy' && hand.cost > 0) {
        return () => {
          if (state.selectedEnergy.has(entry.instanceId)) {
            state.selectedEnergy.delete(entry.instanceId);
          } else if (state.selectedEnergy.size < hand.cost) {
            state.selectedEnergy.add(entry.instanceId);
          }
          render();
        };
      }
    }

    // Selecting an attacker for a Challenge.
    if (phase === 'challenge' && !entry.exhausted && (entry.suit === 'support' || entry.suit === 'wildlife')) {
      return () => {
        state.challengeAttacker = state.challengeAttacker === entry.instanceId ? null : entry.instanceId;
        render();
      };
    }

    return null;
  }

  function onOpponentBoardCardClick(entry, snap) {
    if (snap.game.phase !== 'challenge') return null;
    if (snap.game.currentPlayer !== snap.you) return null;
    if (!state.challengeAttacker) return null;
    if (entry.exhausted) return null;
    if (entry.suit !== 'support' && entry.suit !== 'wildlife') return null;
    return () => {
      sendAction({
        type: 'declareChallenge',
        attackerInstanceId: state.challengeAttacker,
        defenderInstanceId: entry.instanceId,
      });
    };
  }

  function renderPending(snap) {
    pendingPanel.innerHTML = '';
    const me = snap.game.players[0];

    if (snap.game.phase === 'mulligan' && !me.mulliganResolved) {
      const title = document.createElement('strong');
      title.textContent = 'Opening hand choice';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'Keep your opening hand or take one mulligan.';
      const actions = document.createElement('div');
      actions.className = 'choice-actions';
      actions.appendChild(phaseActionButton('Keep', { type: 'mulliganDecision', choice: 'keep' }));
      actions.appendChild(phaseActionButton('Mulligan', { type: 'mulliganDecision', choice: 'mulligan' }, me.mulliganUsed));
      pendingPanel.append(title, meta, actions);
      return;
    }

    if (snap.game.pendingChallenge) {
      const title = document.createElement('strong');
      title.textContent = 'Challenge pending';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'Resolve the current Challenge before any other action.';
      const actions = document.createElement('div');
      actions.className = 'choice-actions';
      actions.appendChild(phaseActionButton('Resolve Challenge', { type: 'resolveChallenge' }));
      pendingPanel.append(title, meta, actions);
    }
  }

  function renderPlayActions(snap) {
    playActions.innerHTML = '';
    if (!state.selectedHand) return;

    const me = snap.game.players[0];
    const hand = me.hand.find(h => h.instanceId === state.selectedHand);
    if (!hand) return;

    const needsEnergy = hand.suit !== 'energy' && hand.cost > 0;
    const ready = !needsEnergy || state.selectedEnergy.size === hand.cost;

    const hint = document.createElement('div');
    hint.className = 'meta';
    hint.textContent = needsEnergy
      ? `Select ${hand.cost} ready Energy card(s) on your board (${state.selectedEnergy.size}/${hand.cost} selected).`
      : `Play ${hand.name} for free.`;
    playActions.appendChild(hint);

    const playBtn = document.createElement('button');
    playBtn.textContent = `Play ${hand.name}`;
    playBtn.disabled = !ready;
    playBtn.onclick = () => sendAction({
      type: 'playCard',
      cardInstanceId: hand.instanceId,
      energyInstanceIds: Array.from(state.selectedEnergy),
    });
    playActions.appendChild(playBtn);
  }

  function render() {
    const snap = state.snapshot;
    statusBar.innerHTML = '';
    phaseButtons.innerHTML = '';

    const pills = [`Room ${roomCode}`];
    if (snap && snap.game) {
      const g = snap.game;
      const turnLabel = g.currentPlayer === snap.you ? 'Your turn' : "Opponent's turn";
      pills.push(`Round ${g.round}`, `Phase ${g.phase}`, turnLabel, `Score ${g.players[0].score} - ${g.players[1].score}`);
      if (g.phase === 'gameover') {
        const label = g.winner === null ? 'Draw' : (g.winner === snap.you ? 'You win!' : 'Opponent wins.');
        pills.push(label);
      }
    } else if (snap) {
      pills.push(`Status ${snap.status}`);
    }
    pills.forEach(text => {
      const span = document.createElement('span');
      span.className = 'pill';
      span.textContent = text;
      statusBar.appendChild(span);
    });

    if (!snap || !snap.game) {
      handZone.innerHTML = '';
      boardZone.innerHTML = '';
      opponentZone.innerHTML = '';
      pendingPanel.innerHTML = '';
      playActions.innerHTML = '';
      logBox.textContent = 'Waiting for the game to start...';
      renderChat(snap);
      return;
    }

    const g = snap.game;
    const me = g.players[0];
    const opp = g.players[1];

    phaseButtons.appendChild(phaseActionButton(
      'Advance Phase',
      { type: 'advancePhase' },
      g.phase === 'mulligan' || g.phase === 'gameover' || !!g.pendingChallenge || g.currentPlayer !== snap.you
    ));

    $('handSummary').textContent = `${me.hand.length} cards \u2022 score ${me.score}`;
    $('boardSummary').textContent = `${me.board.length} in play \u2022 compost ${me.compostCount} \u2022 deck ${me.deckCount}`;
    $('opponentSummary').textContent = `${opp.handCount} cards in hand \u2022 score ${opp.score}`;

    renderZone(handZone, me.hand, entry => ({
      selected: state.selectedHand === entry.instanceId,
      onClick: onHandCardClick(entry, snap, me),
    }));
    renderZone(boardZone, me.board, entry => ({
      selected: state.selectedEnergy.has(entry.instanceId) || state.challengeAttacker === entry.instanceId,
      onClick: onMyBoardCardClick(entry, snap),
    }));
    renderZone(opponentZone, opp.board, entry => ({
      selected: false,
      onClick: onOpponentBoardCardClick(entry, snap),
    }));

    renderPending(snap);
    renderPlayActions(snap);
    logBox.textContent = (g.log || []).join('\n') || 'No log entries yet.';
    renderChat(snap);
  }

  function renderChat(snap) {
    chatMessages.innerHTML = '';
    const entries = (snap && snap.chat) || [];
    entries.forEach(entry => {
      const line = document.createElement('div');
      line.className = 'msg';
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = (snap.you === entry.slot ? 'You' : 'Opponent') + ': ';
      line.appendChild(who);
      line.appendChild(document.createTextNode(entry.message));
      chatMessages.appendChild(line);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  $('chatSend').addEventListener('click', () => {
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    sendChat(text);
  });
  chatInput.addEventListener('keydown', evt => {
    if (evt.key === 'Enter' && !evt.shiftKey) {
      evt.preventDefault();
      $('chatSend').click();
    }
  });

  $('leaveBtn').addEventListener('click', async () => {
    try {
      await api('prototype/api/leave.php', { method: 'POST', body: JSON.stringify({ roomCode }) });
    } catch (err) {
      // Ignore leave errors; still clear local session and redirect.
    }
    sessionStorage.removeItem('roomCode');
    sessionStorage.removeItem('playerToken');
    window.location.href = 'prototype/index.php';
  });

  render();
  fetchState(true);
  state.pollTimer = setInterval(() => fetchState(false), 2000);
})();
</script>
</body>
</html>
